<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Contacto</title>
    <link rel="stylesheet" href="../CSS/NuevoContacto.css">
</head>
<body>

    <div class="layout-wrapper">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Dashboard</h3>
            </div>
            
            <nav class="sidebar-nav">
                <a href="Contactos.html" class="btn-nav">Contactos</a>
                <a href="Contactos.html" class="btn-nav">Contactos</a>
                <a href="Contactos.html" class="btn-nav">Contactos</a>
            </nav>

            <div class="sidebar-footer">
                <p>Usuario: Admin</p>
            </div>
        </aside>

        <main class="main-content">
            <div class="container">
                <form class="contact-form">
                    <h2>Crear Nuevo Contacto</h2>
                    <p>Complete la información básica del contacto.</p>
                    
                    <div class="input-group">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="input-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="input-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" required>
                    </div>

                    <div class="input-group">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" name="categoria">
                            <option value="personal">Personal</option>
                            <option value="trabajo">Trabajo</option>
                            <option value="familia">Familia</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Guardar Contacto</button>
                    <div style="text-align: center; margin-top: 15px;">
                        <a href="Contactos.html" class="btn-volver">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>

    </div>
</body>
</html>
